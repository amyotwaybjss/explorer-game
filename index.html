<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorer Game</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>

    <!-- Bootstrap Formatting -->

    <!-- Headers -->
        <h2>Into the mines...</h2>
        <br>

    <!-- Selector Form -->
        <form id = form>
            <label for="explorer">Choose an explorer:</label>
            <select name="explorer" id="explorer">

                <option value="rachael">Rachael</option>
                <option value="selphie">Selphie</option>
                <option value="fabian">Fabian</option>
                <option value="gary">Gary</option>

            </select>
            <input type="submit" value="Submit">
        </form>

        </div>
        </div>
        </div>

</body>
</html>
